spark.sql.extensions                                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.rest_lab                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.rest_lab.type                       rest
spark.sql.catalog.rest_lab.uri                        http://lakekeeper:8181/catalog
spark.sql.catalog.rest_lab.warehouse                  lab
spark.sql.catalog.rest_lab.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.rest_lab.s3.endpoint                http://minio:9000
spark.sql.catalog.rest_lab.s3.path-style-access       true
spark.sql.catalog.rest_lab.s3.access-key-id           minioadmin
spark.sql.catalog.rest_lab.s3.secret-access-key       minioadmin

spark.sql.defaultCatalog                              rest_lab

# Sensible defaults for the lab
spark.sql.shuffle.partitions                          4
spark.driver.memory                                   2g
spark.executor.memory                                 2g
