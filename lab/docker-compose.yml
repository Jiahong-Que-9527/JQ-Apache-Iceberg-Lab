name: jq-apache-iceberg-lab

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./warehouse-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  bucket-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing \"local/$${MINIO_BUCKET}\"
      "

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3-config.json
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - ./warehouse-seaweed:/data
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweed-bucket-init:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["python", "scripts/ensure_bucket.py", "seaweed"]
    restart: "no"

  jupyter:
    build:
      context: .
    env_file:
      - .env
    environment:
      PYTHONPATH: /home/jovyan/work
      PYICEBERG_HOME: /home/jovyan/work
    depends_on:
      bucket-init:
        condition: service_completed_successfully
      seaweed-bucket-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    # Local-only sandbox. DO NOT use this config in any networked environment.
    command:
      - start-notebook.py
      - "--ServerApp.token=''"
      - "--ServerApp.password=''"
      - "--NotebookApp.token=''"
      - "--NotebookApp.password=''"
